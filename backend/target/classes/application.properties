spring.application.name=autoflow-backend
spring.config.import=optional:classpath:application-local.properties

# Server port
server.port=8080

# MySQL Database Configuration
# Supply production values through environment variables or an ignored
# application-local.properties file. No credentials belong in source control.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/autoflowsrilanka_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=root
spring.datasource.password=Lojan@2003

# Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Logging
logging.file.name=app.log

# JWT Configuration
# A secure 256-bit secret key for signing tokens
jwt.secret=bXktc3VwZXItc2VjcmV0LWtleS1mb3ItYXV0b2Zsb3ctc3JpbGFua2EtYmFja2VuZA==
jwt.expiration=${JWT_EXPIRATION:86400000}

# Required only when creating the initial administrator account.
app.registration.admin-secret=local-admin-secret-123

# Comma-separated browser origins. Credentials cannot be used with a wildcard origin.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Jackson settings
spring.jackson.serialization.fail-on-empty-beans=false
